<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Mastery Academy - Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-blue-100 font-sans">
    <nav class="bg-blue-600 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold">Coding Mastery Academy</a>
            <ul class="flex space-x-4">
                <li><a href="index.html" class="hover:underline">Home</a></li>
                <li><a href="courses.html" class="hover:underline">Courses</a></li>
                <li><a href="contact.html" class="hover:underline">Contact</a></li>
            </ul>
        </div>
    </nav>
    <section class="container mx-auto py-12">
        <h2 class="text-3xl font-bold text-center mb-8">Contact Us</h2>
        <div class="bg-white p-6 rounded-lg shadow-md max-w-lg mx-auto">
            <p class="mb-4">Interested in our Mumbai offline classes or have questions? Reach out!</p>
            <input type="text" id="name" placeholder="Your Name" class="w-full p-3 mb-4 border rounded">
            <input type="email" id="email" placeholder="Your Email" class="w-full p-3 mb-4 border rounded">
            <textarea id="message" placeholder="Your Message (e.g., offline class details)" class="w-full p-3 mb-4 border rounded resize-y"></textarea>
            <button onclick="submitForm()" class="bg-blue-600 text-white px-6 py-3 rounded hover:bg-blue-700">Send Message</button>
            <p id="form-message" class="mt-4 text-blue-600"></p>
        </div>
    </section>
    <footer class="bg-blue-600 text-white text-center py-4">
        <p>&copy; 2025 Coding Mastery Academy. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
