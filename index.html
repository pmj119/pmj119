<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Mastery Academy - Course Details</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-blue-100 font-sans">
    <nav class="bg-blue-600 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold">Coding Mastery Academy</a>
            <ul class="flex space-x-4">
                <li><a href="index.html" class="hover:underline">Home</a></li>
                <li><a href="courses.html" class="hover:underline">Courses</a></li>
                <li><a href="contact.html" class="hover:underline">Contact</a></li>
            </ul>
        </div>
    </nav>
    <section class="container mx-auto py-12">
        <h2 class="text-3xl font-bold text-center mb-8" id="course-title">Course Details</h2>
        <div class="bg-white p-6 rounded-lg shadow-md">
            <p id="course-description" class="mt-4"></p>
            <p id="course-price" class="mt-2"></p>
            <p id="course-format" class="mt-2"></p>
            <h3 class="text-xl font-semibold mt-6">Course Preview</h3>
            <div class="mt-4">
                <iframe class="w-full h-64" src="" id="course-preview" frameborder="0" allowfullscreen></iframe>
                <p class="text-sm text-gray-600">Preview video placeholder (e.g., YouTube embed).</p>
            </div>
            <a href="#" id="enroll-button" class="mt-6 inline-block bg-blue-600 text-white px-6 py-3 rounded hover:bg-blue-700">Enroll Now</a>
        </div>
    </section>
    <footer class="bg-blue-600 text-white text-center py-4">
        <p>&copy; 2025 Coding Mastery Academy. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
